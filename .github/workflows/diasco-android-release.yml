name: DIASCO Android release

on:
  push:
    branches:
      - codex/diasco-thinkdiag
    paths:
      - "android/**"
      - ".github/workflows/diasco-android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.DASHAI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          mkdir -p android/keys
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/keys/dashai-release.jks

      - name: Test and build signed release APK
        working-directory: android
        env:
          DASHAI_UPLOAD_STORE_FILE: ../keys/dashai-release.jks
          DASHAI_UPLOAD_STORE_PASSWORD: ${{ secrets.DASHAI_UPLOAD_STORE_PASSWORD }}
          DASHAI_UPLOAD_KEY_ALIAS: ${{ secrets.DASHAI_UPLOAD_KEY_ALIAS }}
          DASHAI_UPLOAD_KEY_PASSWORD: ${{ secrets.DASHAI_UPLOAD_KEY_PASSWORD }}
          DASHAI_PROD_API_ENDPOINT: ${{ secrets.DASHAI_PROD_API_ENDPOINT }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          jarsigner -verify app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: diasco-2.4.4-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
