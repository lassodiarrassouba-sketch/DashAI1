name: ThinkDiag Android build

on:
  push:
    branches:
      - feature/thinkdiag-obd
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/thinkdiag-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thinkdiag-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        working-directory: android
        env:
          DASHAI_DEBUG_API_ENDPOINT: https://dashai-backend-dabr.onrender.com/api/ask
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diasco-auto-2.4.2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
